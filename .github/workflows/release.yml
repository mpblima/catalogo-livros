name: Testes e releases
on:
  pull_request:
    branches: [master]
  push:
    branches: [master, "feature/**"]
    paths-ignore:
      - 'docs/**'
      - 'scripts/build_pages.py'
      - 'scripts/test_build_pages.py'
      - '.github/workflows/pages.yml'
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: catalogo-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Dependências de compilação e OCR
        run: sudo apt-get update && sudo apt-get install -y libtesseract5 libleptonica-dev libgomp1 tesseract-ocr-eng tesseract-ocr-por xvfb fakeroot
      - name: Preparar OCR incluído
        run: packaging/preparar_ocr.sh
      - name: Testes Java, Swing e persistência
        run: xvfb-run -a mvn -B -Dcatalogo.guiTest=true verify
      - name: Validar OCR
        run: java -jar target/catalogo-livros.jar --verify-ocr
      - name: Gerar instaladores
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        run: ./empacotar_java.sh "2.0.${{ github.run_number }}"
      - name: Validar instalador independente do código-fonte
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        run: |
          dist/*.run --prefix "$RUNNER_TEMP/catalogo_teste" --no-integrate
          mvn -B -Dtest=InstallationIntegrationTest -Dcatalogo.binary="$RUNNER_TEMP/catalogo_teste/catalogo" test
      - name: Guardar relatórios dos testes
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: testes-java
          path: target/surefire-reports/
      - uses: actions/upload-artifact@v7.0.2
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        with:
          name: installers-linux
          path: dist/*
  native:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            type: msi
            platform: windows
          - os: macos-15
            type: dmg
            platform: macos
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compilar e testar
        run: mvn -B "-Dtest=BibliotecaTest,SearchIndexTest,PhysicalBooksTest,BookEditorTest,BookLookupTest,CoverQueueTest,LibraryCategoriesTest,HtmlCatalogConfigTest,LibrarySettingsTest,LibraryServerTest,CloudSyncTest" verify
      - name: Validar SQLite na plataforma
        run: java -jar target/catalogo-livros.jar --verify --library target/smoke-library
      - name: Gerar instalador com Java incluído
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/package-input | Out-Null
          Copy-Item target/catalogo-livros.jar target/package-input/
          $options = @('--type', '${{ matrix.type }}', '--name', 'CatalogoLivros', '--app-version', '2.0.${{ github.run_number }}', '--input', 'target/package-input', '--main-jar', 'catalogo-livros.jar', '--dest', 'dist', '--java-options', '-Dfile.encoding=UTF-8')
          if ($IsWindows) {
            $env:PATH += ";${env:WIX}bin"
            $options += @('--win-menu', '--win-shortcut', '--win-dir-chooser', '--win-per-user-install')
          }
          & "$env:JAVA_HOME/bin/jpackage" @options
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: installers-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
  release:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: [build, native]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          merge-multiple: true
          path: dist
      - name: Publicar release
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: 2.0.${{ github.run_number }}
        run: |
          gh release create "v${VERSION}" dist/* --target "$GITHUB_SHA" --title "Catálogo de Livros ${VERSION}" --generate-notes
